name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libreadline-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user --upgrade buildozer cython
        pip install --user --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build with Buildozer
      env:
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25c
        ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r25c
        P4A_ANDROID_SDK_ACCEPT_LICENSE: 1
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v --accept-all android debug

    # Якщо збірка впаде, цей крок одразу надрукує повний лог помилки в консоль GitHub Actions
    - name: Print Build Log on Failure
      if: failure()
      run: |
        echo "=== SHOWING BUILDOZER LOGS ==="
        find .buildozer -name "build.log" -exec cat {} + || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          bin/*.apk
          /**/*.apk

    # Додатковий крок для завантаження файлу логу, якщо щось піде не так
    - name: Upload Build Log Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-log
        path: .buildozer/**/build.log
        

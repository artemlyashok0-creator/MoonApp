name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
        
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1 # або стандартний kivy/buildozer-action
      with:
        command: buildozer -v android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          bin/*.apk
          **/*.apk
        
